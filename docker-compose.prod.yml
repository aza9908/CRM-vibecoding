services:
  minio:
    image: minio/minio:latest
    restart: unless-stopped
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    command: server /data --console-address ":9001"
    volumes:
      - minio_data:/data
    ports:
      - "127.0.0.1:9000:9000"
      - "127.0.0.1:9001:9001"

  minio-init:
    image: minio/mc:latest
    depends_on:
      - minio
    restart: "no"
    entrypoint: >
      /bin/sh -c "
      until mc alias set local http://minio:9000 ${MINIO_ROOT_USER} ${MINIO_ROOT_PASSWORD}; do sleep 1; done;
      mc mb -p local/${S3_BUCKET};
      mc anonymous set download local/${S3_BUCKET};
      mc admin user add local ${S3_ACCESS_KEY} ${S3_SECRET_KEY};
      mc admin policy attach local readwrite --user ${S3_ACCESS_KEY};
      "

  redis:
    image: redis:7
    restart: unless-stopped

  api:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      - redis
      - minio
    environment:
      DATABASE_URL: ${DATABASE_URL}
      REDIS_URL: redis://redis:6379
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET}
      GROQ_API_KEY: ${GROQ_API_KEY}
      WEB_ORIGIN: ${WEB_ORIGIN}
      API_PUBLIC_URL: ${API_PUBLIC_URL}
      S3_ENDPOINT: ${S3_ENDPOINT}
      S3_BUCKET: ${S3_BUCKET}
      S3_ACCESS_KEY: ${S3_ACCESS_KEY}
      S3_SECRET_KEY: ${S3_SECRET_KEY}
      S3_REGION: ${S3_REGION}
      S3_PUBLIC_URL: https://lms-api.magauin.kz
      # Video room: media server (SFU) inside the API. Browsers send/receive
      # media on RTC_PORT.. (one UDP+TCP port per worker), reached at the
      # server's public IP.
      RTC_ANNOUNCED_IP: ${RTC_ANNOUNCED_IP:-}
      RTC_PORT: "44444"
      RTC_WORKERS: "2"
      PORT: "3001"
    ports:
      - "0.0.0.0:3002:3001"
      - "0.0.0.0:44444-44445:44444-44445/udp"
      - "0.0.0.0:44444-44445:44444-44445/tcp"

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL}
        NEXT_PUBLIC_WS_URL: ${NEXT_PUBLIC_WS_URL}
        # /lms → the app lives at https://airl.kz/lms/ (landing proxies it)
        NEXT_PUBLIC_BASE_PATH: ${NEXT_PUBLIC_BASE_PATH:-}
        # Google OAuth client id (public): call recordings → the host's Drive
        NEXT_PUBLIC_GOOGLE_CLIENT_ID: ${NEXT_PUBLIC_GOOGLE_CLIENT_ID:-}
    restart: unless-stopped
    depends_on:
      - api
    ports:
      - "0.0.0.0:3001:3000"

volumes:
  minio_data:
