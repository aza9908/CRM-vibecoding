name: Deploy LMS to VPS

# Rebuilds the LMS on the VPS (docker compose) from main.
# Run manually: Actions → "Deploy LMS to VPS" → Run workflow
#   or: gh workflow run deploy-vps.yml -R aza9908/CRM-vibecoding
#
# Repository secrets (Settings → Secrets and variables → Actions):
#   VPS_HOST      server IP or hostname
#   VPS_USER      SSH user (e.g. root)
#   VPS_SSH_KEY   private key whose public key is in ~/.ssh/authorized_keys
#     — or —
#   VPS_PASSWORD  SSH password (used only when VPS_SSH_KEY is not set)
#   VPS_APP_DIR   optional: folder of the git clone with docker-compose.prod.yml
#                 (auto-detected when unset)
#   VPS_PORT      optional, default 22
#
# mode=inspect only reports what is on the server and changes nothing.
#
# The server's .env is updated in place so the app serves under /lms
# (https://airl.kz/lms/…) and the API accepts https://airl.kz.
on:
  workflow_dispatch:
    inputs:
      mode:
        description: inspect (read-only report), deploy, or verify (HTTP checks only)
        type: choice
        options: [inspect, deploy, verify, diagnose]
        default: inspect
      base_path:
        description: Sub-path the web app is served under
        default: /lms
      extra_origin:
        description: Origin added to WEB_ORIGIN (CORS + WebSocket)
        default: https://airl.kz
      public_url:
        description: URL checked after the deploy
        default: https://lms.magauin.kz

concurrency:
  group: deploy-vps
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Check secrets
        if: inputs.mode != 'verify'
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          VPS_PASSWORD: ${{ secrets.VPS_PASSWORD }}
        run: |
          missing=""
          for v in VPS_HOST VPS_USER; do
            [ -n "${!v}" ] || missing="$missing $v"
          done
          [ -n "$VPS_SSH_KEY$VPS_PASSWORD" ] || missing="$missing VPS_SSH_KEY|VPS_PASSWORD"
          if [ -n "$missing" ]; then
            echo "::error::Missing repository secrets:$missing"
            exit 1
          fi

      - name: Set up SSH
        if: inputs.mode != 'verify'
        env:
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_PORT: ${{ secrets.VPS_PORT }}
          VPS_PASSWORD: ${{ secrets.VPS_PASSWORD }}
        run: |
          install -m 700 -d ~/.ssh
          ssh-keyscan -p "${VPS_PORT:-22}" -H "$VPS_HOST" >> ~/.ssh/known_hosts 2>/dev/null
          if [ -n "$VPS_SSH_KEY" ]; then
            printf '%s\n' "$VPS_SSH_KEY" > ~/.ssh/id_deploy
            chmod 600 ~/.ssh/id_deploy
            echo 'SSH=ssh -i ~/.ssh/id_deploy -o BatchMode=yes -o ServerAliveInterval=30' >> "$GITHUB_ENV"
          else
            sudo apt-get install -y -qq sshpass >/dev/null
            echo 'SSH=sshpass -e ssh -o PubkeyAuthentication=no -o ServerAliveInterval=30' >> "$GITHUB_ENV"
          fi

      - name: Inspect server (read-only)
        if: inputs.mode != 'verify'
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_PORT: ${{ secrets.VPS_PORT }}
          SSHPASS: ${{ secrets.VPS_PASSWORD }}
        run: |
          echo "== DNS (from the runner)"
          for h in lms.magauin.kz lms-api.magauin.kz server.airl.kz airl.kz; do
            echo "$h → $(dig +short A $h | tr '\n' ' ')"
          done
          echo "VPS_HOST → $VPS_HOST"
          $SSH -p "${VPS_PORT:-22}" "$VPS_USER@$VPS_HOST" bash -s <<'REMOTE'
          echo "== host: $(hostname) · $(. /etc/os-release; echo $PRETTY_NAME) · up $(uptime -p)"
          echo "== disk"; df -h / | tail -1
          echo "== docker"; (docker --version && docker ps --format '{{.Names}}\t{{.Image}}\t{{.Status}}\t{{.Ports}}') 2>&1 | head -30
          echo "== compose projects with an LMS"
          find / -xdev -name docker-compose.prod.yml -path '*' 2>/dev/null | while read f; do
            d=$(dirname "$f"); grep -q 'lms\|apps/web' "$f" && echo "$d (git: $(git -C "$d" remote get-url origin 2>/dev/null) @ $(git -C "$d" rev-parse --short HEAD 2>/dev/null)) .env: $([ -f "$d/.env" ] && echo yes || echo no)"
          done
          echo "== web server"; (nginx -v 2>&1; ls /etc/nginx/sites-enabled 2>/dev/null; ls /etc/caddy 2>/dev/null) | head
          echo "== listening"; (ss -ltnp 2>/dev/null || netstat -ltnp) | awk 'NR==1||/:80 |:443 |:3000 |:3001 |:3002 /'
          echo "== LMS containers: compose metadata + env var NAMES (values hidden)"
          for c in lms-web-1 lms-api-1; do
            docker inspect "$c" >/dev/null 2>&1 || continue
            echo "-- $c"
            docker inspect "$c" --format '{{range $k,$v := .Config.Labels}}{{$k}}={{$v}}{{"\n"}}{{end}}' | grep -E 'compose\.(project|working_dir|config_files|environment_file|service)' || true
            docker inspect "$c" --format '{{range .Config.Env}}{{println .}}{{end}}' | cut -d= -f1 | sort | tr '\n' ' '; echo
            docker inspect "$c" --format '{{range .Config.Env}}{{println .}}{{end}}' | grep -E '^(NEXT_PUBLIC_[A-Z_]*|WEB_ORIGIN|API_PUBLIC_URL|PORT|NODE_ENV)=' || true
          done
          d=$(find / -xdev -name docker-compose.prod.yml 2>/dev/null | xargs -r grep -l 'apps/web' | grep -v '\.bak' | head -1 | xargs -r dirname)
          if [ -n "$d" ]; then
            echo "-- clone $d"; git -C "$d" status --short | head -20; git -C "$d" log --oneline -1
            echo "-- server-side diff of tracked files (values of secret-like keys redacted)"
            git -C "$d" diff | sed -E 's/((SECRET|PASSWORD|TOKEN|_KEY|KEY_ID)[A-Z_]*[=:][[:space:]]*)[^$[:space:]].*/\1<redacted>/I'
            echo "-- env-like files (names only)"; find "$d" -maxdepth 3 \( -name '.env*' -o -name '*.env' \) -not -path '*/node_modules/*' 2>/dev/null
          fi
          echo "== nginx lms sites (server_name / proxy_pass / location)"
          grep -hE 'server_name|proxy_pass|location|listen' /etc/nginx/sites-enabled/lms.magauin.kz /etc/nginx/sites-enabled/lms-api.magauin.kz 2>/dev/null
          REMOTE

      - name: Diagnose login and data (counts only — logs are public)
        if: inputs.mode == 'diagnose'
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_PORT: ${{ secrets.VPS_PORT }}
          SSHPASS: ${{ secrets.VPS_PASSWORD }}
        run: |
          echo "== public URLs"
          for u in https://airl.kz/ https://www.airl.kz/ https://airl.kz/lms https://airl.kz/lms/ru/login https://www.airl.kz/lms/ru/login https://lms.magauin.kz/; do
            echo "$u → $(curl -s -o /dev/null -w '%{http_code} %{redirect_url}' "$u")"
          done
          chunk=$(curl -s https://airl.kz/lms/ru/login | grep -o '/lms/_next/static/[^"]*\.js' | head -1)
          echo "JS chunk $chunk → $(curl -s -o /dev/null -w '%{http_code}' "https://airl.kz$chunk")"
          echo "== CORS from each origin (login preflight + bad-password POST)"
          for o in https://airl.kz https://www.airl.kz https://lms.magauin.kz; do
            pre=$(curl -s -o /dev/null -D - -X OPTIONS https://lms-api.magauin.kz/auth/login -H "Origin: $o" -H 'Access-Control-Request-Method: POST' -H 'Access-Control-Request-Headers: content-type' | grep -i '^access-control-allow-origin' | tr -d '\r')
            post=$(curl -s -o /dev/null -w '%{http_code}' -X POST https://lms-api.magauin.kz/auth/login -H "Origin: $o" -H 'content-type: application/json' -d '{"email":"nobody@example.com","password":"wrong-password-1"}')
            echo "$o → preflight [$pre] · bad login → $post"
          done
          echo "== refresh cookie attributes (from a failed refresh)"
          curl -s -D - -o /dev/null -X POST https://lms-api.magauin.kz/auth/refresh -H 'Origin: https://airl.kz' | grep -i 'set-cookie\|^HTTP' | sed -E 's/=[A-Za-z0-9._-]{20,}/=<token>/'
          echo "== database (counts only)"
          $SSH -p "${VPS_PORT:-22}" "$VPS_USER@$VPS_HOST" "docker exec -i -w /app/apps/api lms-api-1 node -" <<'NODE'
          const { Pool } = require('pg');
          const pool = new Pool({ connectionString: process.env.DATABASE_URL });
          (async () => {
            const q = async (sql, args = []) => (await pool.query(sql, args)).rows;
            console.log('orgs', (await q('select count(*)::int n from organizations'))[0].n,
              '· users', (await q('select count(*)::int n from users'))[0].n,
              '· lessons', (await q('select count(*)::int n from lessons'))[0].n,
              '· blocks', (await q('select count(*)::int n from lesson_blocks'))[0].n,
              '· sessions', (await q('select count(*)::int n from live_sessions'))[0].n,
              '· responses', (await q('select count(*)::int n from responses'))[0].n);
            const me = await q(`select u.role, u.is_platform_admin, u.organization_id is not null as has_org,
                 u.password_hash is not null as has_password, u.created_at::date as created,
                 (select count(*)::int from lessons l where l.organization_id = u.organization_id) as org_lessons,
                 (select count(*)::int from lessons l where l.organization_id = u.organization_id and not l.archived) as org_active_lessons,
                 (select count(*)::int from lessons l where l.organization_id = u.organization_id and l.created_at > now() - interval '1 day') as org_lessons_new_today
               from users u where encode(sha256(lower(u.email)::bytea),'hex') = $1`, ['3cccbd597a602e0fa99175a1adb9be332a6407ab984ed2c059bdef88ef262960']);
            console.log('owner account:', me.length ? JSON.stringify(me[0]) : 'NOT FOUND');
            const recent = await q(`select count(*)::int n from lessons where created_at > now() - interval '1 day'`);
            console.log('lessons created in the last 24h (all orgs):', recent[0].n);
            await pool.end();
          })().catch((e) => { console.error('db error:', e.message); process.exit(1); });
          NODE

      - name: Pull main, update .env, rebuild containers
        if: inputs.mode == 'deploy'
        env:
          SSHPASS: ${{ secrets.VPS_PASSWORD }}
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_PORT: ${{ secrets.VPS_PORT }}
          VPS_APP_DIR: ${{ secrets.VPS_APP_DIR }}
          BASE_PATH: ${{ inputs.base_path }}
          EXTRA_ORIGIN: ${{ inputs.extra_origin }}
        run: |
          $SSH -p "${VPS_PORT:-22}" "$VPS_USER@$VPS_HOST" \
            "APP_DIR='$VPS_APP_DIR' BASE_PATH='$BASE_PATH' EXTRA_ORIGIN='$EXTRA_ORIGIN' EXPECTED_COMPOSE='acda3ae48a1bc4fddd085708d73a128e82c9c4b4' bash -s" <<'REMOTE'
          set -euo pipefail
          if [ -z "$APP_DIR" ]; then
            APP_DIR=$(find / -xdev -name docker-compose.prod.yml 2>/dev/null \
              | grep -v '\.bak' | xargs -r grep -l 'apps/web' | head -1 | xargs -r dirname)
          fi
          [ -n "$APP_DIR" ] && [ -d "$APP_DIR/.git" ] || { echo "LMS clone not found on this server"; exit 1; }
          cd "$APP_DIR"
          ENV_FILE=.env.prod; [ -f "$ENV_FILE" ] || ENV_FILE=.env
          [ -f "$ENV_FILE" ] || { echo "No .env.prod/.env in $APP_DIR — refusing to deploy"; exit 1; }
          PREV=$(git rev-parse HEAD)
          BK="$APP_DIR/.deploy-backup/$(date +%Y%m%d%H%M%S)"
          mkdir -p "$BK"
          cp "$ENV_FILE" "$BK/env"; cp docker-compose.prod.yml "$BK/docker-compose.prod.yml"
          echo "$PREV" > "$BK/prev-sha"; echo "$ENV_FILE" > "$BK/env-file"
          ln -sfn "$BK" "$APP_DIR/.deploy-backup/latest"
          echo "== $APP_DIR @ ${PREV:0:7}, env file $ENV_FILE, backup $BK"

          # Server-side edits: only the known production compose file may differ.
          changed=$(git diff --name-only)
          if [ -n "$changed" ]; then
            if [ "$changed" != "docker-compose.prod.yml" ]; then
              echo "Unexpected local changes, refusing to pull:"; echo "$changed"; exit 1
            fi
            if [ "$(git hash-object docker-compose.prod.yml)" != "$EXPECTED_COMPOSE" ] && [ "$EXPECTED_COMPOSE" != "any" ]; then
              echo "docker-compose.prod.yml on the server is not the reviewed version — refusing"; exit 1
            fi
            git checkout -- docker-compose.prod.yml   # main carries it (+ /lms build arg)
          fi
          git fetch origin main
          git checkout main
          git pull --ff-only origin main
          echo "== now at $(git rev-parse --short HEAD)"

          # NEXT_PUBLIC_BASE_PATH=/lms
          if grep -q '^NEXT_PUBLIC_BASE_PATH=' "$ENV_FILE"; then
            sed -i "s#^NEXT_PUBLIC_BASE_PATH=.*#NEXT_PUBLIC_BASE_PATH=$BASE_PATH#" "$ENV_FILE"
          else
            printf '\nNEXT_PUBLIC_BASE_PATH=%s\n' "$BASE_PATH" >> "$ENV_FILE"
          fi
          # WEB_ORIGIN += https://airl.kz (CORS + WebSocket origins)
          if grep -q '^WEB_ORIGIN=' "$ENV_FILE"; then
            cur=$(grep '^WEB_ORIGIN=' "$ENV_FILE" | tail -1 | cut -d= -f2- | tr -d '"')
            case ",$cur," in
              *",$EXTRA_ORIGIN,"*) ;;
              *) sed -i "s#^WEB_ORIGIN=.*#WEB_ORIGIN=${cur:+$cur,}$EXTRA_ORIGIN#" "$ENV_FILE" ;;
            esac
          else
            printf 'WEB_ORIGIN=%s\n' "$EXTRA_ORIGIN" >> "$ENV_FILE"
          fi
          grep -E '^(NEXT_PUBLIC_[A-Z_]*|WEB_ORIGIN)=' "$ENV_FILE"

          if docker compose version >/dev/null 2>&1; then DC="docker compose"; else DC="docker-compose"; fi
          # Build first: if the build fails, the running containers stay untouched.
          $DC --env-file "$ENV_FILE" -f docker-compose.prod.yml build api web
          $DC --env-file "$ENV_FILE" -f docker-compose.prod.yml up -d api web
          $DC --env-file "$ENV_FILE" -f docker-compose.prod.yml ps api web
          sleep 15
          docker logs --tail 40 lms-api-1 2>&1 | grep -E 'Orzu|workbook|ERROR|listening|started' || true
          docker image prune -f >/dev/null || true
          REMOTE

      - name: Verify the site answers under the base path
        if: inputs.mode == 'deploy' || inputs.mode == 'verify'
        env:
          PUBLIC_URL: ${{ inputs.public_url }}
          BASE_PATH: ${{ inputs.base_path }}
        run: |
          url="${PUBLIC_URL%/}$BASE_PATH"
          for i in $(seq 1 30); do
            code=$(curl -s -o /dev/null -w '%{http_code}' "$url/uz" || true)
            echo "try $i: $url/uz → $code"
            [ "$code" = "200" ] && break
            sleep 10
          done
          [ "$code" = "200" ] || { echo "::error::$url/uz did not return 200"; exit 1; }
          echo "root → $(curl -s -o /dev/null -w '%{http_code} %{redirect_url}' "${PUBLIC_URL%/}/")"
          echo "en   → $(curl -s -o /dev/null -w '%{http_code}' "$url/en")"

      - name: Roll back on failure
        if: failure() && inputs.mode == 'deploy'
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_PORT: ${{ secrets.VPS_PORT }}
          VPS_APP_DIR: ${{ secrets.VPS_APP_DIR }}
          SSHPASS: ${{ secrets.VPS_PASSWORD }}
        run: |
          $SSH -p "${VPS_PORT:-22}" "$VPS_USER@$VPS_HOST" "APP_DIR='$VPS_APP_DIR' bash -s" <<'REMOTE'
          set -euo pipefail
          if [ -z "$APP_DIR" ]; then
            APP_DIR=$(find / -xdev -name docker-compose.prod.yml 2>/dev/null \
              | grep -v '\.bak' | xargs -r grep -l 'apps/web' | head -1 | xargs -r dirname)
          fi
          BK="$APP_DIR/.deploy-backup/latest"
          [ -f "$BK/prev-sha" ] || { echo "No backup to roll back to"; exit 0; }
          cd "$APP_DIR"
          ENV_FILE=$(cat "$BK/env-file")
          git reset -q --hard "$(cat "$BK/prev-sha")"
          cp "$BK/docker-compose.prod.yml" docker-compose.prod.yml
          cp "$BK/env" "$ENV_FILE"
          if docker compose version >/dev/null 2>&1; then DC="docker compose"; else DC="docker-compose"; fi
          $DC --env-file "$ENV_FILE" -f docker-compose.prod.yml up -d --build api web
          echo "Rolled back to $(git rev-parse --short HEAD)"
          REMOTE
