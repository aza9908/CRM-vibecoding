            ["Урок 4 Кайзен",     "Урок 4 Кайзен",          "Кайзен",        40],
            ["Q&A 1",             "Q&A 1 Кайзен",           "Кайзен",        50],
            ["Q&A 1 Кайзен",      "Q&A 1 Кайзен",           "Кайзен",        50],
            ["Q&A 2",             "Q&A 2 Кайзен",           "Кайзен",        60],
            ["Q&A 2 Кайзен",      "Q&A 2 Кайзен",           "Кайзен",        60],
            ["Демо-день",         "Демо-день Кайзен",       "Кайзен",        70],
            ["Демо-день Кайзен",  "Демо-день Кайзен",       "Кайзен",        70],
            ["Investudy 1 урок",  "Урок 1 Investudy",       "Investudy",     10],
            ["Урок 1 Investudy",  "Урок 1 Investudy",       "Investudy",     10],
            ["Investudy 2 урок",  "Урок 2 Investudy",       "Investudy",     20],
            ["Урок 2 Investudy",  "Урок 2 Investudy",       "Investudy",     20],
            ["Kazakhtelecom",     "Урок 1 Kazakhtelecom",   "Kazakhtelecom", 10],
            ["Урок 1 Kazakhtelecom", "Урок 1 Kazakhtelecom", "Kazakhtelecom", 10]
          ]
          PLAN
          { printf '%s\n' "$EMAIL_SHA256"; sed 's/^          //' plan.json | tr -d '\n'; echo; } | $SSH -p "${VPS_PORT:-22}" "$VPS_USER@$VPS_HOST" "docker exec -i -w /app/apps/api lms-api-1 node -e '
            const [eh, planRaw] = require(\"fs\").readFileSync(0, \"utf8\").trim().split(\"\\n\");
            const plan = JSON.parse(planRaw);
            const { Pool } = require(\"pg\");
            const pool = new Pool({ connectionString: process.env.DATABASE_URL });
            (async () => {
              const u = (await pool.query(\"select organization_id from users where encode(sha256(lower(email)::bytea), \\x27hex\\x27) = \$1\", [eh])).rows[0];
              if (!u || !u.organization_id) { console.error(\"account not found or has no company\"); process.exit(2); }
              let changed = 0;
              for (const [from, to, category, order] of plan) {
                const r = await pool.query(\"update lessons set title = \$1, category = \$2, \\\"order\\\" = \$3 where organization_id = \$4 and title = \$5 and not archived\", [to, category, order, u.organization_id, from]);
                changed += r.rowCount;
