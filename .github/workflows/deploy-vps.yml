      - uses: actions/checkout@v4
        if: inputs.mode == 'call-smoke' || inputs.mode == 'analysis-smoke' || inputs.mode == 'create-lesson'

      - name: Video call smoke test from the internet (teacher + student, temporary lesson)
        if: inputs.mode == 'call-smoke'
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_PORT: ${{ secrets.VPS_PORT }}
          SSHPASS: ${{ secrets.VPS_PASSWORD }}
          EMAIL_SHA256: ${{ inputs.email_sha256 }}
          API: https://lms-api.magauin.kz
          WEB: https://airl.kz/lms
        run: |
          set -euo pipefail
          [[ "$EMAIL_SHA256" =~ ^[0-9a-f]{64}$ ]] || { echo "::error::email_sha256 must be 64 hex chars"; exit 1; }
          # A 15-minute access token for the account, minted on the server and
          # masked in the log. Never printed.
          TOKEN=$(printf '%s\n' "$EMAIL_SHA256" | $SSH -p "${VPS_PORT:-22}" "$VPS_USER@$VPS_HOST" "docker exec -i -w /app/apps/api lms-api-1 node -e '
            const eh = require(\"fs\").readFileSync(0, \"utf8\").trim();
            const { Pool } = require(\"pg\");
            const jwt = require(\"jsonwebtoken\");
            const pool = new Pool({ connectionString: process.env.DATABASE_URL });
            (async () => {
              const u = (await pool.query(\"select id, role, organization_id, is_platform_admin from users where encode(sha256(lower(email)::bytea), \\x27hex\\x27) = \$1\", [eh])).rows[0];
              if (!u) { console.error(\"account not found\"); process.exit(2); }
              const payload = { sub: u.id, role: u.role, orgId: u.organization_id || \"\", aud: \"user\" };
              if (u.is_platform_admin) payload.isPlatformAdmin = true;
              process.stdout.write(jwt.sign(payload, process.env.JWT_ACCESS_SECRET, { expiresIn: \"15m\" }));
              await pool.end();
            })().catch((e) => { console.error(\"error: \" + e.message); process.exit(1); });
          '")
          echo "::add-mask::$TOKEN"
          [ -n "$TOKEN" ] || { echo "::error::no token"; exit 1; }
          mkdir -p /tmp/smoke && cp .github/scripts/call-smoke.js /tmp/smoke/ && cd /tmp/smoke
          npm init -y >/dev/null && npm install --silent playwright@1 >/dev/null
          npx playwright install --with-deps chromium >/dev/null
          TOKEN="$TOKEN" node call-smoke.js

      - name: AI lesson review smoke test (real transcription + model, service lesson)
        if: inputs.mode == 'analysis-smoke'
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_PORT: ${{ secrets.VPS_PORT }}
          SSHPASS: ${{ secrets.VPS_PASSWORD }}
          EMAIL_SHA256: ${{ inputs.email_sha256 }}
          API: https://lms-api.magauin.kz
          WEB: https://airl.kz/lms
        run: |
          set -euo pipefail
          [[ "$EMAIL_SHA256" =~ ^[0-9a-f]{64}$ ]] || { echo "::error::email_sha256 must be 64 hex chars"; exit 1; }
          # A 15-minute access token for the account, minted on the server and
          # masked in the log. Never printed.
          TOKEN=$(printf '%s\n' "$EMAIL_SHA256" | $SSH -p "${VPS_PORT:-22}" "$VPS_USER@$VPS_HOST" "docker exec -i -w /app/apps/api lms-api-1 node -e '
            const eh = require(\"fs\").readFileSync(0, \"utf8\").trim();
            const { Pool } = require(\"pg\");
            const jwt = require(\"jsonwebtoken\");
            const pool = new Pool({ connectionString: process.env.DATABASE_URL });
            (async () => {
              const u = (await pool.query(\"select id, role, organization_id, is_platform_admin from users where encode(sha256(lower(email)::bytea), \\x27hex\\x27) = \$1\", [eh])).rows[0];
              if (!u) { console.error(\"account not found\"); process.exit(2); }
              const payload = { sub: u.id, role: u.role, orgId: u.organization_id || \"\", aud: \"user\" };
              if (u.is_platform_admin) payload.isPlatformAdmin = true;
              process.stdout.write(jwt.sign(payload, process.env.JWT_ACCESS_SECRET, { expiresIn: \"15m\" }));
              await pool.end();
            })().catch((e) => { console.error(\"error: \" + e.message); process.exit(1); });
          '")
          echo "::add-mask::$TOKEN"
          [ -n "$TOKEN" ] || { echo "::error::no token"; exit 1; }
          # Which provider is live (mock = no GROQ_API_KEY on the server).
          $SSH -p "${VPS_PORT:-22}" "$VPS_USER@$VPS_HOST" "docker logs lms-api-1 2>&1 | grep -ciE 'Mock LLM provider is active' | sed 's/^/mock-provider log lines: /'" || true
          # Is the server's Groq key valid, and which models does it see? (key never printed)
          $SSH -p "${VPS_PORT:-22}" "$VPS_USER@$VPS_HOST" "docker exec -i lms-api-1 node -e '
            const k = (process.env.GROQ_API_KEY || \"\").trim();
            console.log(\"groq key: \" + (k ? \"set, \" + k.length + \" chars, prefix \" + k.slice(0, 4) : \"EMPTY\"));
            fetch(\"https://api.groq.com/openai/v1/models\", { headers: { authorization: \"Bearer \" + k } })
              .then(async (r) => {
                const j = await r.json().catch(() => ({}));
                const ids = (j.data || []).map((m) => m.id);
                console.log(\"groq /models: HTTP \" + r.status + \" · models \" + ids.length);
                console.log(\"  whisper: \" + (ids.filter((i) => /whisper/.test(i)).join(\", \") || \"none\"));
                console.log(\"  chat default present (openai/gpt-oss-120b): \" + ids.includes(\"openai/gpt-oss-120b\"));
                if (r.status !== 200) console.log(\"  error: \" + JSON.stringify(j.error || j).slice(0, 200));
              })
              .catch((e) => console.log(\"groq unreachable: \" + e.message));
          '" || true
          TOKEN="$TOKEN" node .github/scripts/analysis-smoke.js

      - name: Create a lesson from a spec file in the account's company
        if: inputs.mode == 'create-lesson'
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_PORT: ${{ secrets.VPS_PORT }}
          SSHPASS: ${{ secrets.VPS_PASSWORD }}
          EMAIL_SHA256: ${{ inputs.email_sha256 }}
          API: https://lms-api.magauin.kz
          LESSON_SPEC: ${{ inputs.lesson_spec }}
          FORCE: ${{ inputs.force }}
          WEB: https://airl.kz/lms
        run: |
          set -euo pipefail
          [[ "$EMAIL_SHA256" =~ ^[0-9a-f]{64}$ ]] || { echo "::error::email_sha256 must be 64 hex chars"; exit 1; }
          # A 15-minute access token for the account, minted on the server and
          # masked in the log. Never printed.
          TOKEN=$(printf '%s\n' "$EMAIL_SHA256" | $SSH -p "${VPS_PORT:-22}" "$VPS_USER@$VPS_HOST" "docker exec -i -w /app/apps/api lms-api-1 node -e '
            const eh = require(\"fs\").readFileSync(0, \"utf8\").trim();
            const { Pool } = require(\"pg\");
            const jwt = require(\"jsonwebtoken\");
            const pool = new Pool({ connectionString: process.env.DATABASE_URL });
            (async () => {
              const u = (await pool.query(\"select id, role, organization_id, is_platform_admin from users where encode(sha256(lower(email)::bytea), \\x27hex\\x27) = \$1\", [eh])).rows[0];
              if (!u) { console.error(\"account not found\"); process.exit(2); }
              const payload = { sub: u.id, role: u.role, orgId: u.organization_id || \"\", aud: \"user\" };
              if (u.is_platform_admin) payload.isPlatformAdmin = true;
              process.stdout.write(jwt.sign(payload, process.env.JWT_ACCESS_SECRET, { expiresIn: \"15m\" }));
              await pool.end();
            })().catch((e) => { console.error(\"error: \" + e.message); process.exit(1); });
          '")
          echo "::add-mask::$TOKEN"
          [ -n "$TOKEN" ] || { echo "::error::no token"; exit 1; }
          SPEC="$LESSON_SPEC" FORCE="$FORCE" TOKEN="$TOKEN" node .github/scripts/create-lesson.js

      - name: Roll back on failure
        if: failure() && inputs.mode == 'deploy'
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_PORT: ${{ secrets.VPS_PORT }}
          VPS_APP_DIR: ${{ secrets.VPS_APP_DIR }}
          SSHPASS: ${{ secrets.VPS_PASSWORD }}
        run: |
          $SSH -p "${VPS_PORT:-22}" "$VPS_USER@$VPS_HOST" "APP_DIR='$VPS_APP_DIR' bash -s" <<'REMOTE'
          set -euo pipefail
          if [ -z "$APP_DIR" ]; then
            # The LMS git clone: has docker-compose.prod.yml with the web app and a .git
            # folder (skips backups such as .deploy-backup/ and lms.bak-*).
            APP_DIR=$(find / -xdev -name docker-compose.prod.yml -not -path '*/.deploy-backup/*' 2>/dev/null \
              | xargs -r grep -l 'apps/web' | while read -r f; do d=$(dirname "$f"); if [ -d "$d/.git" ]; then echo "$d"; fi; done | head -1 || true)
          fi
          BK="$APP_DIR/.deploy-backup/latest"
          [ -f "$BK/prev-sha" ] || { echo "No backup to roll back to"; exit 0; }
          cd "$APP_DIR"
          ENV_FILE=$(cat "$BK/env-file")
          git reset -q --hard "$(cat "$BK/prev-sha")"
          cp "$BK/docker-compose.prod.yml" docker-compose.prod.yml
          cp "$BK/env" "$ENV_FILE"
          if docker compose version >/dev/null 2>&1; then DC="docker compose"; else DC="docker-compose"; fi
          $DC --env-file "$ENV_FILE" -f docker-compose.prod.yml up -d --build api web
          echo "Rolled back to $(git rev-parse --short HEAD)"
          REMOTE
