name: LMS on airl.kz names

# Moves the LMS off the magauin.kz host names (lms.magauin.kz, lms-api.magauin.kz)
# onto airl.kz ones. The server and containers stay the same; only the public
# names change.
#
#   audit — read-only report: public settings, nginx sites, where the old host
#           name is stored in the database (counts only), live sessions now.
#
# Uses the same VPS_* secrets as deploy-vps.yml. Logs are public: no secret
# values are printed.
on:
  workflow_dispatch:
    inputs:
      mode:
        description: audit (read-only)
        type: choice
        options: [audit]
        default: audit

concurrency:
  group: deploy-vps
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Set up SSH
        env:
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_PORT: ${{ secrets.VPS_PORT }}
        run: |
          [ -n "$VPS_HOST" ] || { echo "::error::VPS_HOST secret missing"; exit 1; }
          install -m 700 -d ~/.ssh
          ssh-keyscan -p "${VPS_PORT:-22}" -H "$VPS_HOST" >> ~/.ssh/known_hosts 2>/dev/null
          if [ -n "$VPS_SSH_KEY" ]; then
            printf '%s\n' "$VPS_SSH_KEY" > ~/.ssh/id_deploy
            chmod 600 ~/.ssh/id_deploy
            echo 'SSH=ssh -i ~/.ssh/id_deploy -o BatchMode=yes -o ServerAliveInterval=30' >> "$GITHUB_ENV"
          else
            sudo apt-get install -y -qq sshpass >/dev/null
            echo 'SSH=sshpass -e ssh -o PubkeyAuthentication=no -o ServerAliveInterval=30' >> "$GITHUB_ENV"
          fi

      - name: Audit (read-only)
        if: inputs.mode == 'audit'
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_PORT: ${{ secrets.VPS_PORT }}
          SSHPASS: ${{ secrets.VPS_PASSWORD }}
        run: |
          $SSH -p "${VPS_PORT:-22}" "$VPS_USER@$VPS_HOST" bash -s <<'REMOTE'
          set -uo pipefail
          echo "== time: $(date -u +%FT%TZ) · Astana $(TZ=Asia/Almaty date +%H:%M)"
          ENVF=$(docker inspect lms-web-1 --format '{{ index .Config.Labels "com.docker.compose.project.environment_file" }}')
          echo "== LMS public settings (not secret)"
          grep -E '^(NEXT_PUBLIC_[A-Z_]*|API_PUBLIC_URL|S3_PUBLIC_URL|S3_ENDPOINT|S3_BUCKET|S3_REGION|WEB_ORIGIN)=' "$ENVF"
          echo "== all setting names: $(grep -oE '^[A-Z0-9_]+=' "$ENVF" | tr -d '=' | tr '\n' ' ')"
          echo "== nginx sites of the LMS"
          for f in /etc/nginx/sites-enabled/lms.magauin.kz /etc/nginx/sites-enabled/lms-api.magauin.kz /etc/nginx/conf.d/lms-hardening.conf; do
            echo "---- $f"; grep -viE 'password|secret|token|auth_basic_user_file' "$f" 2>&1
          done
          echo "== certificates"; certbot certificates 2>/dev/null | grep -E 'Certificate Name|Domains|Expiry' | sed 's/^ *//'
          echo "== DNS: lms-api.airl.kz → $( (getent ahostsv4 lms-api.airl.kz || true) | awk '{print $1}' | sort -u | tr '\n' ' ')· lms-api.magauin.kz → $( (getent ahostsv4 lms-api.magauin.kz || true) | awk '{print $1}' | sort -u | tr '\n' ' ')"
          echo "== sessions by status"
          docker exec lms-db-1 psql -U lms -d lms -tAc "select status || ': ' || count(*) from sessions group by status order by 1" 2>&1 | sed 's/^/  /'
          echo "== people connected to live lessons right now (websocket connections to the API)"
          echo "  $(docker exec lms-api-1 sh -c 'cat /proc/net/tcp 2>/dev/null | wc -l' 2>/dev/null || echo '?') open TCP sockets in the API container"
          echo "== where the old host name is stored in the database (counts only)"
          docker exec -i lms-db-1 psql -U lms -d lms -tA 2>&1 <<'SQL' | sed 's/^/  /'
          do $$ declare r record; n bigint; begin
            for r in select table_name, column_name from information_schema.columns
                     where table_schema = 'public' and data_type in ('text', 'character varying', 'json', 'jsonb') loop
              execute format('select count(*) from %I where %I::text like %L', r.table_name, r.column_name, '%magauin.kz%') into n;
              if n > 0 then raise notice '%.% : % rows', r.table_name, r.column_name, n; end if;
            end loop;
          end $$;
          SQL
          echo "== files bucket: $(docker exec lms-minio-1 sh -c 'ls /data 2>/dev/null | tr "\n" " "')"
          REMOTE
