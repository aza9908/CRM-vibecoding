# Firebase App Hosting configuration for the NestJS API (apps/api).
# App Hosting builds with buildpacks (pnpm is detected from the lockfile)
# and injects PORT=8080 at runtime; main.ts already reads process.env.PORT.

runConfig:
  cpu: 2
  memoryMiB: 2048
  # Scaled to 0: the live site now runs on the VPS (lms-api.magauin.kz).
  # Kept as a cold-start fallback rather than deleted outright — a rollback
  # here just needs a rollout, not reprovisioning the backend from scratch.
  minInstances: 0
  # Keep a single instance while REDIS_URL is unset: the Socket.IO adapter
  # falls back to in-memory, so rooms/broadcasts only work within one instance.
  maxInstances: 1
  concurrency: 120

scripts:
  # IMPORTANT: do NOT set buildCommand here. The App Hosting buildpack rewrites
  # package.json when buildCommand is present and silently drops the
  # "workspaces" field, breaking the npm-workspaces monorepo install
  # (https://github.com/GoogleCloudPlatform/buildpacks/issues/621).
  # The build is defined instead as the "apphosting:build" script in the root
  # package.json, which the buildpack picks up without rewriting the file.
  runCommand: node apps/api/dist/main.js

env:
  - variable: NODE_ENV
    value: production
    availability:
      - RUNTIME
  - variable: DATABASE_URL
    secret: DATABASE_URL
    availability:
      - RUNTIME
  # LLM provider for AI block generation (topic-based and upload-from-file)
  # — GroqProvider reads this at boot; without it every AI generation call
  # fails (see AiService.runBlockGeneration's error handling).
  - variable: GROQ_API_KEY
    secret: GROQ_API_KEY
    availability:
      - RUNTIME
  # CORS/WS origins of the deployed frontend (comma-separated).
  - variable: WEB_ORIGIN
    value: https://lms.magauin.kz,https://lms-web--lms-ai-a2fd7.europe-west4.hosted.app
    availability:
      - RUNTIME
  # Absolute API origin for DB-backed upload/download URLs when S3_* is unset.
  - variable: API_PUBLIC_URL
    value: https://lms-ai--lms-ai-a2fd7.europe-west4.hosted.app
    availability:
      - RUNTIME
# Optional: add S3_ENDPOINT / S3_BUCKET / S3_ACCESS_KEY / S3_SECRET_KEY as
# Secret Manager refs to switch from Postgres object storage to R2/S3.
